[package]
name = "detection-wasm-filter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# proxy-wasm host functions only exist inside Envoy's WASM runtime, so the
# SDK is a wasm-target-only dependency; `cargo test` on the host exercises
# the pure signing logic without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
proxy-wasm = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = true
